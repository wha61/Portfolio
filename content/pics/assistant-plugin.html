<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>语音助手模块 - 受保护</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; }
    #auth-section, #main-section { max-width: 600px; margin: auto; }
    #main-section { display: none; }
    input[type="password"] {
      padding: 10px; font-size: 16px; width: 100%; margin-bottom: 10px;
    }
    button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 6px; background-color: #007bff; color: white; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    video { border: 1px solid #ccc; border-radius: 8px; margin-top: 10px; width: 100%; }
    #response { margin-top: 15px; white-space: pre-wrap; background: #fff; padding: 10px; border: 1px solid #ccc; border-radius: 6px; color: #222; }
  </style>
</head>
<body>

<div id="auth-section">
  <h2>🔒 输入密码访问助手</h2>
  <input type="password" id="password" placeholder="请输入访问密码">
  <button onclick="verifyPassword()">确认</button>
  <div id="auth-error" style="color: red; margin-top: 10px;"></div>
</div>

<div id="main-section">
  <h2>语音助手模块</h2>
  <video id="video" autoplay playsinline></video><br>
  <button onclick="startRecognition()">开始监听</button>
  <div id="user-text" style="margin-top: 10px; font-weight: bold; color: #444;"></div>
  <div id="response"></div>
</div>

<script>
  const CORRECT_PASSWORD = "abc123"; // 你可以换成任何密码（前端可见，安全性有限）

  function verifyPassword() {
    const input = document.getElementById("password").value;
    const errorDiv = document.getElementById("auth-error");
  
    if (input === CORRECT_PASSWORD) {
      document.getElementById("auth-section").style.display = "none";
      document.getElementById("main-section").style.display = "block";
  
      // 延迟加载 plugin.js
      const script = document.createElement("script");
      script.src = "/pics/plugin.js";
      script.onload = () => {
        // 在加载 plugin.js 成功后调用 initCamera
        if (typeof initCamera === "function") {
          initCamera();
        }
      };
      document.body.appendChild(script);
    } else {
      errorDiv.textContent = "❌ 密码错误，请重试。";
    }
  }

</script>

</body>
</html>
