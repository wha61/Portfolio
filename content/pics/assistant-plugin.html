<!-- public/assistant-plugin.html -->
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>智能助手模块</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; }
    video { border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; }
    button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 6px; background-color: #007bff; color: white; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    #response { margin-top: 15px; white-space: pre-wrap; background: #fff; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>语音助手模块</h2>
  <video id="video" autoplay playsinline width="100%"></video><br>
  <button onclick="startRecognition()">开始监听</button>
  <div id="user-text" style="margin-top: 10px; font-weight: bold; color: #444;"></div>
  <div id="response" style="margin-top: 10px; white-space: pre-wrap; color: #222;"></div>

  <!-- 根据实际路径修改这里 -->
  <script src="plugin.js"></script>
</body>
</html>
